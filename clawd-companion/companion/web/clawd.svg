<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-label="Clawd" id="clawd-root" style="display:block;overflow:visible">
  <!-- Clawd. Original artwork for clawd-companion.
       Swap this file for your own and keep the ids below; app.js drives them by id.
       Character only: the thought bubble, caption text, the badge glyph and the
       rings are HTML layers drawn over this SVG. -->
  <defs>
    <clipPath id="clawd-glass-clip">
      <path d="M2 0 L30 0 L26 40 L6 40 Z"/>
    </clipPath>
  </defs>

  <ellipse id="clawd-shadow" cx="100" cy="178" rx="50" ry="6" fill="currentColor" opacity="0.08"/>

  <g id="clawd">
    <g id="clawd-breathe">
      <g id="legs" fill="#B85A3A">
        <rect x="58" y="140" width="12" height="24" rx="4"/>
        <rect x="80" y="140" width="12" height="24" rx="4"/>
        <rect x="108" y="140" width="12" height="24" rx="4"/>
        <rect x="130" y="140" width="12" height="24" rx="4"/>
      </g>

      <g id="arm-left">
        <rect x="18" y="92" width="28" height="18" rx="9" fill="#C96A49"/>
      </g>

      <!-- Held in the right hand; hidden unless the hydration state is on. -->
      <g id="glass" transform="translate(156,66)">
        <path d="M2 0 L30 0 L26 40 L6 40 Z" fill="rgba(129,140,248,0.14)"/>
        <g clip-path="url(#clawd-glass-clip)">
          <rect id="water" x="0" y="12" width="34" height="32" fill="#818CF8" opacity="0.9"/>
        </g>
        <path d="M2 0 L30 0 L26 40 L6 40 Z" fill="none" stroke="#818CF8"
              stroke-width="2.5" stroke-linejoin="round"/>
      </g>

      <g id="arm-right">
        <rect x="154" y="92" width="28" height="18" rx="9" fill="#C96A49"/>
      </g>

      <rect id="body" x="40" y="60" width="120" height="88" rx="20" fill="#D97757"/>
      <rect id="clawd-sheen" x="50" y="66" width="100" height="16" rx="8" fill="#E8977A" opacity="0.55"/>

      <g id="eyes">
        <rect id="eye-left"  x="72"  y="88" width="12" height="22" rx="5" fill="#1E1B4B"/>
        <rect id="eye-right" x="116" y="88" width="12" height="22" rx="5" fill="#1E1B4B"/>
        <path class="eye-happy" d="M70 106 Q78 90 86 106" fill="none" stroke="#1E1B4B"
              stroke-width="5" stroke-linecap="round"/>
        <path class="eye-happy" d="M114 106 Q122 90 130 106" fill="none" stroke="#1E1B4B"
              stroke-width="5" stroke-linecap="round"/>
      </g>

      <!-- The gold disc only. The "?" glyph is an HTML layer in index.html. -->
      <g id="badge">
        <circle cx="44" cy="50" r="17" fill="#FBCF4F"/>
      </g>
    </g>

    <g id="drops">
      <g transform="translate(16,56)">
        <path d="M0 -7 C3 -2 5 1 5 4 A5 5 0 0 1 -5 4 C-5 1 -3 -2 0 -7 Z" fill="#818CF8"/>
      </g>
      <g transform="translate(30,38)">
        <path d="M0 -7 C3 -2 5 1 5 4 A5 5 0 0 1 -5 4 C-5 1 -3 -2 0 -7 Z" fill="#818CF8"/>
      </g>
      <g transform="translate(8,78)">
        <path d="M0 -7 C3 -2 5 1 5 4 A5 5 0 0 1 -5 4 C-5 1 -3 -2 0 -7 Z" fill="#818CF8"/>
      </g>
    </g>

    <g id="sparkle">
      <path d="M26 44 L29 52 L37 55 L29 58 L26 66 L23 58 L15 55 L23 52 Z" fill="#FBCF4F"/>
      <path d="M170 52 L172.5 58 L178 60 L172.5 62 L170 68 L167.5 62 L162 60 L167.5 58 Z" fill="#FBCF4F"/>
      <path d="M150 34 L152 39 L157 41 L152 43 L150 48 L148 43 L143 41 L148 39 Z" fill="#FBCF4F"/>
    </g>

    <g id="check-badge">
      <circle cx="152" cy="52" r="16" fill="#16A34A"/>
      <path d="M145 52 L150 57 L160 47" fill="none" stroke="#FFFFFF" stroke-width="3.5"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
